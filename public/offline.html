<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075553">
  <title>Periksa koneksi · NIVO</title>
  <style>
    :root{--primary:178 85% 18%;--foreground:174 30% 14%;--secondary:25 95% 53%;--card:0 0% 100%;--radius-card:1rem;--radius-control:.75rem}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;background:hsl(var(--card));color:hsl(var(--foreground));font:1rem/1.6 system-ui,sans-serif}
    main{max-width:28rem;margin:1rem;padding:2rem;border-radius:var(--radius-card);border:1px solid hsl(var(--secondary)/.25);background:linear-gradient(135deg,hsl(var(--secondary)/.09),hsl(var(--card)));box-shadow:0 10px 32px hsl(var(--foreground)/.055)}
    h1{color:hsl(var(--primary));font-size:1.7rem}a{display:inline-flex;align-items:center;justify-content:center;min-height:3rem;margin-top:1rem;padding:0 1rem;border-radius:var(--radius-control);background:hsl(var(--primary));color:hsl(var(--card));text-decoration:none}a:focus-visible{outline:3px solid hsl(var(--primary));outline-offset:4px}img{width:4rem;height:4rem}
  </style>
</head>
<body><main><img src="/logo.png" alt="NIVO"><h1>Koneksi belum tersedia</h1><p>Halaman ini memerlukan koneksi. Isian tertunda yang sudah disimpan pada perangkat tetap ada; buka NIVO lagi setelah terhubung.</p><a href="/home">Coba buka NIVO lagi</a></main></body>
</html>
